name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: |
          mkdir -p /tmp/wstp
          echo "int dummy;" > dummy.c
          gcc -c dummy.c -o dummy.o
          ar rcs /tmp/wstp/libWSTP64i4.a dummy.o
          WSTP_COMPILER_ADDITIONS_DIRECTORY=/tmp/wstp cargo test
      - name: build
        run: WSTP_COMPILER_ADDITIONS_DIRECTORY=/tmp/wstp cargo build

